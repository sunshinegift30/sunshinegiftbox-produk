<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine Giftbox Bya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sunshine Giftbox Bya</h1>
        <p>Kado Custom Spesial untuk Setiap Moment</p>
    </header>
    
    <section id="products">
        <h2>Daftar Produk</h2>
        <div class="product-list">
            <!-- Random Products -->
            <div class="product">
                <img src="https://via.placeholder.com/150" alt="Bricks Susun">
                <h3>Bricks Susun</h3>
                <p>10K</p>
                <button class="add-to-cart" data-name="Bricks Susun" data-price="10000">Tambah ke Keranjang</button>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/150" alt="Cermin">
                <h3>Cermin</h3>
                <p>12K</p>
                <button class="add-to-cart" data-name="Cermin" data-price="12000">Tambah ke Keranjang</button>
            </div>
            <!-- More products can be added here -->
        </div>
    </section>

    <section id="cart">
        <h2>Keranjang Belanja</h2>
        <ul id="cart-list"></ul>
        <button id="checkout">Checkout via WhatsApp</button>
    </section>

    <footer>
        <p>&copy; 2025 Sunshine Giftbox Bya</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
